[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightcurve-reduction"
version = "0.1.0"
description = "Example research code for reducing and analysing telescope light curves of planetary-mass objects."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Repository authors" }
]
keywords = [
  "astronomy",
  "photometry",
  "time-series",
  "light-curves",
  "periodogram",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy==1.25.0",
  "scipy==1.11.1",
  "astropy==5.3",
  "photutils==1.8.0",
  "matplotlib==3.7.1",
  "tqdm==4.66.1",
  "Pillow==10.0.0",
  "imageio==2.31.1",
  "seaborn==0.13.1",
  "bgls",
]

[project.urls]
Repository = "https://github.com/your-username/lightcurve-reduction"

[tool.setuptools.packages.find]
where = ["src"]
